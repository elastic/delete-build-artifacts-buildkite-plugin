services:
  plugin-lint:
    image: buildkite/plugin-linter:v3.0.0
    command: ["--id", "elastic/delete-build-artifacts", "--path", "/plugin"]
    volumes:
      - ".:/plugin:ro,z"

  test:
    build:
      context: .
    command: ["bats", "tests/unit"]
    volumes:
      - ".:/plugin:ro,z"

  integration-test:
    build:
      context: .
    command: ["bats", "tests/integration"]
    environment:
      CI: "${CI:-true}"
    volumes:
      - ".:/plugin:ro,z"

  shellcheck:
    image: koalaman/shellcheck-alpine:v0.11.0
    working_dir: /plugin
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        find hooks lib .buildkite/scripts
        -type f -not -name '*.ps1'
        | xargs shellcheck --shell=bash --external-sources --format=gcc
    volumes:
      - ".:/plugin:ro,z"
