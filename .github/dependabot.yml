version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
    labels:
      - "changelog:dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "22:00"
    labels:
      - "changelog:dependencies"
    open-pull-requests-limit: 5
